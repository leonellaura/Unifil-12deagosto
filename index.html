<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youtube</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">

</head>
<body>
    <header class="cabeçalho">
        <div class="cabeçalho-início">
            <i class="fa-solid fa-bars"></i>
            <div class="logotipo">
                <i class="fa-brands fa-youtube logotipo-ícone"></i>
                <p class="logotipo-nome">YouTube</p>
                <p class="logotipo-país">BR</p>


            </div>

        </div>
        <div class="cabeçalho-centro">
            <div class="search">
                <input type="text" name="search" id="search-input" class="search-input">
                <button class="search-button">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
            <button class="microfone">
                <i class="fa-solid fa-microphone"></i>
            </button>
            
        </div>
        <div class="cabeçalho-final">
            <button class="logotipo-video" title="Criar">
                <i class="fa-solid fa-video"></i>
            </button>
            <button class="logotipo-video" title="Notificaçõe">
                <i class="fa-solid fa-bell"></i>
            </button>
            <button class="logotipo-video" title="Sua conta">L</button>
        </div>
    </header>
    <script src="script.js"></script>
</body>
</html>
