<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youtube</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
</head>

<body>
    <header class="cabeçalho">
        <div class="cabeçalho-inicio">
            <i class="fa-solid fa-bars"></i>
            <div class="logotipo">
                <i class="fa-brands fa-youtube logotipo-icone"></i>
                <span class="logotipo-nome">Youtube</span>
                <span class="logotipo-país">BR</span>
            </div>
        </div>

        <div class="cabeçalho-centro">
            <div class="search">
                <input type="text" name="search" class="search-input">
                <button class="search-button">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>

            <button class="microphone">
                <i class="fa-solid fa-microphone"></i>
            </button>

        </div>

        <div class="cabeçalho-final">
            a
        </div>
    </header>

    <script src="script.js"></script>
</body>

</html>
